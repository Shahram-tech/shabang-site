<!doctype html>
<html lang="ckb" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>shabang.site — تێست</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f6f3ec;
    --ink: #1f1d1a;
    --muted: #6b665d;
    --accent: #c2512b;
    --card: #ffffff;
    --line: #e4ded2;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #151412;
      --ink: #f1ece3;
      --muted: #a59e92;
      --accent: #ec7a50;
      --card: #1f1d1a;
      --line: #34302a;
    }
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    font-family: "Vazirmatn", Tahoma, sans-serif;
    background: var(--bg);
    color: var(--ink);
    display: grid;
    place-items: center;
    padding: 24px 16px;
    line-height: 1.8;
  }
  main {
    width: 100%;
    max-width: 560px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 40px 32px;
    text-align: center;
  }
  .dot {
    display: inline-block;
    width: 12px; height: 12px;
    border-radius: 50%;
    background: #2f9e5b;
    box-shadow: 0 0 0 6px rgba(47, 158, 91, .15);
    margin-bottom: 20px;
  }
  h1 {
    font-size: clamp(2rem, 7vw, 3rem);
    font-weight: 900;
    letter-spacing: -.01em;
    direction: ltr;
  }
  h1 span { color: var(--accent); }
  p { color: var(--muted); margin-top: 12px; font-size: 1.1rem; }
  .meta {
    margin-top: 28px;
    padding-top: 20px;
    border-top: 1px solid var(--line);
    font-size: .95rem;
    color: var(--muted);
  }
  .meta b { color: var(--ink); font-weight: 700; }
</style>
</head>
<body>
<main>
  <div class="dot" aria-hidden="true"></div>
  <h1>shabang<span>.site</span></h1>
  <p>ئەم پەڕەیە تێستە. ئەگەر دەیبینیت، هۆستینگەکە کار دەکات.</p>
  <div class="meta">
    دۆخ: <b>کار دەکات</b> · بارکراوە لە: <b>٢٠٢٦/١١/٢٤</b>
  </div>
</main>
</body>
</html>
